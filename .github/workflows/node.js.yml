# CI for this dependency-free static site.
# 1. JSON validity and JS syntax (incl. inline <script> blocks)
# 2. Keyboard accessibility over CDP (runs first: it expects the
#    onboarding tour to auto-open; the journey test suppresses it)
# 3. End-to-end user journey over CDP

name: Static site checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x

    - name: Static checks (JSON + JS syntax)
      run: node scripts/ci-check.mjs

    - name: Start dev server and headless Chrome
      run: |
        node scripts/dev-server.mjs --port 7100 &
        google-chrome --headless=new --disable-gpu --no-sandbox \
          --disable-dev-shm-usage --user-data-dir=/tmp/ce-ci-profile \
          --remote-debugging-port=9222 about:blank &
        for i in $(seq 1 40); do
          curl -sf http://localhost:9222/json/list > /dev/null && break
          sleep 0.5
        done

    - name: Keyboard accessibility test
      run: python3 scripts/kbd-test.py http://localhost:7100

    - name: End-to-end user journey test
      run: python3 scripts/e2e-journey.py http://localhost:7100
