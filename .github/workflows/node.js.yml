# CI for this dependency-free static site: JSON validity and JS syntax
# (including inline <script> blocks) across every page.

name: Static site checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
    - run: node scripts/ci-check.mjs
